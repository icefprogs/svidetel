name: Windows build and checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1 -SelfContained
      - name: Isolated registry round-trip
        shell: pwsh
        run: ./tests/bin/Release/net9.0-windows/Svidetel.Tests.exe --integration
      - name: Task and shortcut round-trip
        shell: pwsh
        run: ./scripts/Test-LaunchPoints.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Svidetel-windows-x64
          path: artifacts/Svidetel-windows-x64.zip
